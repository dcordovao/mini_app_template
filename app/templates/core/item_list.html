{% extends "base.html" %}

{% block title %}Items{% endblock %}

{% block content %}
  <h1>Items</h1>
  <ul class="list-group">
    {% for item in items %}
      <li class="list-group-item">{{ item.name }}</li>
    {% empty %}
      <li class="list-group-item">No hay items todavía.</li>
    {% endfor %}
  </ul>
{% endblock %}
