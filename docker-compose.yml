services:

  db:
    image: postgres:17.7-alpine
    volumes:
      - db_volume:/var/lib/postgresql/data/
    env_file:
      - dev.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis_pr:
    image: "redis:8.0-alpine"
    expose:
      - "6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_pr_data:/data
    deploy:
      resources:
        limits:
          memory: 512M

  app:
    build:
      context: ./app
    volumes:
      - ./app/:/app
      - app_volume:/vol/app
    ports:
      - "8000:8000"
    env_file:
      - dev.env
    # initapp: migrate + cache table + admin/admin if it doesn't exist (safe to run on every start)
    command: ["sh", "-c", "python manage.py initapp && python manage.py runserver 0.0.0.0:8000"]
    depends_on:
      db:
        condition: service_healthy
      redis_pr:
        condition: service_started

volumes:
  db_volume:
  app_volume:
  redis_pr_data: